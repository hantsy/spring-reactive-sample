spring.application.name=boot-httpexchange
server.port=8080
logging.level.root=INFO
logging.level.web=DEBUG
logging.level.com.example.demo=DEBUG
# convert the internal errors to problem details standard format
spring.webflux.problemdetails.enabled=true
# the client proxy calls the server running in this same application
spring.http.serviceclient[post].base-url=http://localhost:8080
demo.client-runner.enabled=true