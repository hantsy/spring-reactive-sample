spring.application.name=boot-api-versioning-webflux
logging.level.web=trace

# API versioning via the X-API-Version request header
spring.webflux.apiversion.use.header=X-API-Version
# Alternative resolution strategies:
# spring.webflux.apiversion.use.path-segment=0
# spring.webflux.apiversion.use.query-parameter=version
# spring.webflux.apiversion.use.media-type-parameter[application/json]=v
spring.webflux.apiversion.supported=1.0,1.1,2.0
spring.webflux.apiversion.detect-supported=false
# Setting a default version also makes the version optional per request
spring.webflux.apiversion.default=1.0