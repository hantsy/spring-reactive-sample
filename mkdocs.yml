site_name: Just Enough Spring WebFlux
site_description: A practical guide to Spring WebFlux, Reactor, and the reactive ecosystem, built around runnable examples.
site_author: Hantsy Bai
site_url: https://hantsy.github.io/spring-reactive-sample/
repo_name: hantsy/spring-reactive-sample
repo_url: https://github.com/hantsy/spring-reactive-sample

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hantsy/spring-reactive-sample

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Preface: preface.md
  - Getting Started:
      - start/intro.md
      - start/reactive-streams.md
      - start/first.md
      - start/boot-first.md
  - Web Programming:
      - web/intro.md
      - web/web-filter.md
      - web/func.md
      - web/exception.md
      - web/problem-details.md
      - web/multipart.md
      - web/sse.md
      - web/websocket.md
      - web/view.md
      - web/client.md
      - web/httpexchange.md
      - web/api-versioning.md
  - Data Operations:
      - data/intro.md
      - data/mongo.md
      - data/redis.md
      - data/cassandra.md
      - data/couchbase.md
      - data/elasticsearch.md
      - data/neo4j.md
      - data/r2dbc.md
  - Security:
      - security/intro.md
      - security/start.md
      - security/config.md
      - security/config-boot.md
      - security/method.md
      - security/user-details-repo.md
      - security/form.md
  - Testing:
      - testing/intro.md
      - testing/web-components.md
      - testing/security.md
      - testing/testcontainers.md
      - testing/spring-test.md
      - testing/kotlin.md
  - Kotlin:
      - kotlin/intro.md
      - kotlin/kotlin.md
      - kotlin/coroutines.md
      - kotlin/dsl.md
      - kotlin/misc.md
  - Reactive Ecosystem:
      - Reactive libraries:
          - other/mutiny.md
          - other/rxjava.md
          - other/java9.md
          - other/groovy.md
      - Cross-cutting concerns:
          - other/cache.md
          - other/event.md
          - other/schedule.md
          - other/restdocs.md
      - RSocket:
          - other/rsocket/intro.md
          - other/rsocket/tcp.md
          - other/rsocket/websocket.md
          - other/rsocket/crud.md
          - other/rsocket/declarative-client.md
          - other/rsocket/integration.md
      - Spring Session:
          - other/session/intro.md
          - other/session/in-memory.md
          - other/session/redis.md
          - other/session/mongo.md
          - other/session/header.md
      - Spring Integration:
          - other/integration/intro.md
          - other/integration/webflux.md
          - other/integration/dsl.md
          - other/integration/message-channel.md
